<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 — Page Not Found</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .error {
      text-align: center;
    }

    .number {
      font-size: clamp(100px, 20vw, 260px);
      line-height: .8;
      letter-spacing: -0.08em;
      font-weight: 700;
    }

    p {
      margin-top: 35px;
      font-size: 14px;
      opacity: .6;
    }

    a {
      display: inline-block;
      margin-top: 25px;
      color: #fff;
      text-decoration: none;
      border-bottom: 1px solid #fff;
      padding-bottom: 4px;
      font-size: 14px;
    }

    a:hover {
      opacity: .6;
    }
  </style>
</head>

<body>

  <main class="error">
    <div class="number">404</div>
    <p>The page you're looking for doesn't exist.</p>
    <a href="https://projek-andinurulfr-faqih.vercel.app/">Back to home ↗</a>
  </main>

</body>
</html>
